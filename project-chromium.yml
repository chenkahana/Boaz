include:
  - project-dmg.yml
name: BoazChromiumUI
packages:
  BoazKit:
    path: ${BOAZ_CHROMIUM_REPO_ROOT}/Packages/BoazKit
# Reuse distribution dependencies/settings without generating the existing app targets.
targets:REPLACE:
  Boaz-ChromiumUI:
    type: library.dynamic
    platform: macOS
    deploymentTarget: "26.0"
    scheme: {}
    sources:
      - path: Apps/macOS
        excludes: [Info.plist, "*.entitlements"]
      - Apps/Shared
      - Apps/Browser
    dependencies:
      - package: BoazKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: BoazApplicationUI
        PRODUCT_MODULE_NAME: BoazApplicationUI
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BOAZ_CHROMIUM DIRECT_DISTRIBUTION SPARKLE
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../Tools/chromium/host/boaz_host.h
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ARCHS: arm64
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
