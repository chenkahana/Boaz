name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
  workflow_dispatch:

# A pull request cancels its own older runs. A push to master or a release branch is grouped by its sha, so
# every pushed commit finishes its run and a red one can't be hidden by the next push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build BoazKit, iPhone and Mac apps
    # The iOS 27.1 SDK ships with Xcode 27, which GitHub offers on this runner image.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        # A fixed release, checked against its published SHA-256, instead of whatever Homebrew has today.
        env:
          VERSION: "2.46.0"
          SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
          echo "$SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            Packages/BoazKit/.build
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/BoazKit/Package.resolved') }}

      - name: Copy lint
        # Hand-built plurals and percentages (docs/copy.md).
        run: Tools/copy-lint.sh

      - name: Build BoazKit
        run: make kit

      - name: Test BoazKit
        run: make kit-test

      - name: Build iPhone app and extensions
        run: make ios

      - name: Build Mac app
        run: make mac

      - name: Build the WebKit DMG configuration
        # The rollback app (project-webkit-dmg.yml) keeps building, and only ever as a build: no release uploads it.
        run: |
          make mac-webkit-dmg
          ! grep -n -E 'release-webkit-mac|--webkit' .github/workflows/release.yml

  uitest:
    name: Mac UI tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        env:
          VERSION: "2.46.0"
          SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
          echo "$SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            Packages/BoazKit/.build
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/BoazKit/Package.resolved') }}

      - name: Allow XCUITest to drive the Mac
        # Automation Mode otherwise asks an administrator to approve the first run.
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Run BoazUITests
        run: make uitest

      - name: Summarize the test results
        # Counts and the names of failed and skipped tests, so a green tick shows what ran (docs/qa.md §5).
        if: always()
        continue-on-error: true
        run: |
          R=build/UITestResults.xcresult
          if [ ! -d "$R" ]; then echo "### Mac UI tests: no result bundle (the tests didn't run)" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          xcrun xcresulttool get test-results summary --path "$R" > "$RUNNER_TEMP/summary.json"
          xcrun xcresulttool get test-results tests --path "$R" > "$RUNNER_TEMP/tests.json"
          python3 - "$RUNNER_TEMP/summary.json" "$RUNNER_TEMP/tests.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          tests = json.load(open(sys.argv[2]))["testNodes"]
          def cases(nodes, result):
              for n in nodes:
                  if n.get("nodeType") == "Test Case" and n.get("result") == result:
                      why = next((c["name"] for c in n.get("children", []) if c.get("nodeType") in ("Failure Message", "Skip Message")), "")
                      yield n["nodeIdentifier"], why
                  yield from cases(n.get("children", []), result)
          print(f"### Mac UI tests: {s['result']}\n")
          print(f"{s['passedTests']} passed, {s['failedTests']} failed, {s['skippedTests']} skipped\n")
          for result in ("Failed", "Skipped"):
              rows = list(cases(tests, result))
              if rows:
                  print(f"**{result}**\n")
                  for name, why in rows:
                      print(f"- `{name}`" + (f": {why}" if why else ""))
                  print()
          PY

      - name: Upload the test results
        # Kept a week when the run fails, three days when it passes.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UITestResults
          path: build/UITestResults.xcresult
          retention-days: ${{ job.status == 'success' && 3 || 7 }}
          if-no-files-found: ignore
