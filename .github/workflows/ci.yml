name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build FolioKit, iPhone and Mac apps
    # The iOS 27.1 SDK ships with Xcode 27, which GitHub offers on this runner image.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            Packages/FolioKit/.build
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/FolioKit/Package.resolved') }}

      - name: Build FolioKit
        run: make kit

      - name: Build iPhone app and extensions
        run: make ios

      - name: Build Mac app
        run: make mac
