name: Auto-merge

# Pull requests squash-merge on their own once the required checks pass, only after a maintainer adds the automerge label.
# Only people with triage access can label pull requests.
on:
  pull_request_target:
    types: [labeled, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Runs with write access on pull_request_target, so it never checks out or runs the pull request's code.
    steps:
      - run: gh pr merge "$PR" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
