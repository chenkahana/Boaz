name: Runtime acceptance

# PLAN-02 rows 2-4 on a throwaway Mac: a published Boaz DMG, driven through its own opt-in Local Automation
# (Tools/acceptance/runtime.py). It only downloads releases: it never builds, signs, notarizes or publishes anything.
on:
  push:
    branches: ["release/**"]
    paths:
      - .github/workflows/runtime-acceptance.yml
      - Tools/acceptance/**
      - Tools/chromium/automation_client.py
      - Tests/BoazUITests/BoazAcceptanceUITests.swift
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        default: v0.4.48

# One run per commit, as in ci.yml: a later push never cancels an earlier commit's evidence.
concurrency:
  group: runtime-acceptance-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ inputs.tag || 'v0.4.48' }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || 'v0.4.48' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        env:
          VERSION: "2.46.0"
          SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
          echo "$SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Allow XCUITest to drive the Mac
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Build the native-UI steps
        # BUILD_ONLY: the step skips, so this only builds them before Boaz is installed.
        run: make acceptance-uitest TEST=testMenusNameNoEngine BUILD_ONLY=1

      - name: Download the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p Boaz.dmg -p Boaz.dmg.sha256 -D "$RUNNER_TEMP/$TAG"
          (cd "$RUNNER_TEMP/$TAG" && shasum -a 256 -c Boaz.dmg.sha256)

      - name: Run the checks
        run: python3 Tools/acceptance/runtime.py "$RUNNER_TEMP/$TAG/Boaz.dmg" "$RUNNER_TEMP/runtime"

      - name: Summary
        if: always()
        run: |
          echo "# Runtime acceptance, $TAG" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/runtime/results.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ env.TAG }}
          path: ${{ runner.temp }}/runtime
          retention-days: 30
