name: Boaz
include:
  # Passkeys in web pages: a managed entitlement, off until Apple grants it (passkeys.yml).
  - path: passkeys.yml
    enable: false
  # Default browser on iPhone: a managed entitlement, off until Apple grants it (web-browser.yml).
  - path: web-browser.yml
    enable: false
options:
  bundleIdPrefix: com.chenkahana
  deploymentTarget:
    iOS: "27.1"
    macOS: "26.0"
packages:
  BoazKit:
    path: Packages/BoazKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: DPF8459C2J
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: Boaz
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Boaz
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  # CloudKit environment, a separate database each. Release builds use Production, like the DMG and App Store builds,
  # so a Release build on a phone (`make device`) syncs with them. Debug builds use Development, whose schema grows
  # as they save new fields.
  configs:
    Debug:
      BOAZ_CLOUDKIT_ENVIRONMENT: Development
    Release:
      BOAZ_CLOUDKIT_ENVIRONMENT: Production
targets:
  Boaz-iOS:
    type: application
    platform: iOS
    scheme: {}
    sources: [Apps/iOS, Apps/Shared, Apps/Browser]
    dependencies:
      - package: BoazKit
      - target: ShareExtension
        embed: true
      - target: Widgets
        embed: true
    entitlements:
      path: Apps/iOS/Boaz.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chenkahana.boaz
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chenkahana.boaz]
        com.apple.developer.icloud-container-environment: $(BOAZ_CLOUDKIT_ENVIRONMENT)
        aps-environment: development
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS through the system only: exempt from export compliance documentation.
        ITSAppUsesNonExemptEncryption: false
        # Websites can ask for these (video calls, photo uploads from the camera, maps); iOS asks the user first.
        NSCameraUsageDescription: Websites you visit can ask to use your camera, for example for video calls or to take a photo to upload.
        NSMicrophoneUsageDescription: Websites you visit can ask to use your microphone, for example for calls or voice search.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location, for example to show nearby places on a map.
        NSFaceIDUsageDescription: Boaz asks for Face ID before it fills a saved password or shows your passwords.
        # Background refresh for sync; remote notifications are CloudKit's change pushes.
        BGTaskSchedulerPermittedIdentifiers: [com.chenkahana.boaz.sync]
        # audio: a video keeps playing, and floats in Picture in Picture, after leaving Boaz.
        UIBackgroundModes: [audio, fetch, remote-notification]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.chenkahana.boaz
            CFBundleURLSchemes: [boaz]
          # Required for the default browser entitlement (web-browser.yml); iOS ignores it until that's granted.
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.chenkahana.boaz.web
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.boaz
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Alternate icons for Settings › App Icon. Each name needs a matching .appiconset in Assets.xcassets
        # (generated by Tools/make-icon.swift), or the asset-catalog step fails.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Midnight AppIcon-Glass AppIcon-Aurora AppIcon-Electric AppIcon-Tide AppIcon-Violet AppIcon-Sunset AppIcon-Peach AppIcon-Sorbet AppIcon-Paper AppIcon-Graphite AppIcon-Noir"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  Boaz-macOS:
    type: application
    platform: macOS
    scheme: {}
    sources: [Apps/macOS, Apps/Shared, Apps/Browser]
    dependencies:
      - package: BoazKit
    entitlements:
      path: Apps/macOS/Boaz.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chenkahana.boaz]
        com.apple.developer.icloud-container-environment: $(BOAZ_CLOUDKIT_ENVIRONMENT)
        com.apple.developer.aps-environment: development
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.chenkahana.boaz.web
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        # Same bundle ID as the iPhone app: one App Store record (universal purchase) and one iCloud App ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.boaz
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Required for notarization (the DMG on GitHub Releases); allowed on the App Store.
        ENABLE_HARDENED_RUNTIME: YES
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [Apps/Extensions/ShareExtension, Apps/Shared]
    dependencies:
      - package: BoazKit
    entitlements:
      path: Apps/Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chenkahana.boaz
    info:
      path: Apps/Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to Boaz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.boaz.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Apps/Extensions/Widgets, Apps/Shared]
    dependencies:
      - package: BoazKit
    entitlements:
      path: Apps/Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chenkahana.boaz
    info:
      path: Apps/Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Boaz Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.boaz.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
