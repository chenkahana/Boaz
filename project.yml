name: Folio
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.1"
    macOS: "26.0"
packages:
  FolioKit:
    path: Packages/FolioKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Folio
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Folio
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  Folio-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared]
    dependencies:
      - package: FolioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.folio
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  Folio-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS, Apps/Shared]
    dependencies:
      - package: FolioKit
    entitlements:
      path: Apps/macOS/Folio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.folio.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
