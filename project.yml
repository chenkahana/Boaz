name: Folio
options:
  bundleIdPrefix: com.chenkahana
  deploymentTarget:
    iOS: "27.1"
    macOS: "26.0"
packages:
  FolioKit:
    path: Packages/FolioKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: DPF8459C2J
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Folio
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Folio
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  Folio-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared, Apps/Browser]
    dependencies:
      - package: FolioKit
      - target: ShareExtension
        embed: true
      - target: Widgets
        embed: true
    entitlements:
      path: Apps/iOS/Folio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chenkahana.folio
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chenkahana.folio]
        aps-environment: development
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS through the system only: exempt from export compliance documentation.
        ITSAppUsesNonExemptEncryption: false
        # Websites can ask for these (video calls, photo uploads from the camera, maps); iOS asks the user first.
        NSCameraUsageDescription: Websites you visit can ask to use your camera, for example for video calls or to take a photo to upload.
        NSMicrophoneUsageDescription: Websites you visit can ask to use your microphone, for example for calls or voice search.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location, for example to show nearby places on a map.
        # Background refresh for sync; remote notifications are CloudKit's change pushes.
        BGTaskSchedulerPermittedIdentifiers: [com.chenkahana.folio.sync]
        UIBackgroundModes: [fetch, remote-notification]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.chenkahana.folio
            CFBundleURLSchemes: [folio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.folio
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Alternate icon sets are produced by another agent; if an icon asset is missing the
        # asset-catalog build step fails even though these settings themselves are correct.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Peach AppIcon-Electric AppIcon-Violet AppIcon-Midnight"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  Folio-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS, Apps/Shared, Apps/Browser]
    dependencies:
      - package: FolioKit
    entitlements:
      path: Apps/macOS/Folio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chenkahana.folio]
        com.apple.developer.aps-environment: development
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.chenkahana.folio.web
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        # Same bundle ID as the iPhone app: one App Store record (universal purchase) and one iCloud App ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.folio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [Apps/Extensions/ShareExtension, Apps/Shared]
    dependencies:
      - package: FolioKit
    entitlements:
      path: Apps/Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chenkahana.folio
    info:
      path: Apps/Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to Folio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.folio.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Apps/Extensions/Widgets, Apps/Shared]
    dependencies:
      - package: FolioKit
    entitlements:
      path: Apps/Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chenkahana.folio
    info:
      path: Apps/Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Folio Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.folio.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
