# Default browser on iPhone. With this entitlement, Boaz shows up in Settings › Apps › Boaz › Default Browser App and
# iOS opens every http/https link from other apps in it. It is a managed entitlement that Apple grants per App ID
# through the default browser entitlement request form (request ZSPFUT855L). Signing with it fails on an App ID
# without the grant; project.yml includes this file, and `enable: false` there turns it off. The Mac needs no
# entitlement for this.
targets:
  Boaz-iOS:
    entitlements:
      properties:
        com.apple.developer.web-browser: true
