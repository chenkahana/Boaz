# Default browser on iPhone. With this entitlement, Boaz shows up in Settings › Apps › Boaz › Default Browser App and
# iOS opens every http/https link from other apps in it. It is a managed entitlement that Apple grants per App ID
# through the default browser entitlement request form; Boaz's App ID has it. Signing with it fails on an App ID
# without the grant; `enable: false` on this file's include in project.yml turns it off. It also compiles the Default
# Browser section in Settings (DEFAULT_BROWSER). The Mac needs no entitlement for this.
targets:
  Boaz-iOS:
    entitlements:
      properties:
        com.apple.developer.web-browser: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEFAULT_BROWSER
