[package]
name = "boaz-adblock"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
adblock = { path = "vendor/adblock", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
serde_json = "1"

[profile.release]
panic = "unwind"
